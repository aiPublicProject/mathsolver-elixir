name: hex.pm release
on:
  workflow_dispatch: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require secret
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "::error::HEX_API_KEY secret not configured (org Settings - Secrets - Actions)"
            exit 1
          fi
      - uses: erlef/setup-beam@v1
        with: { elixir-version: '1.16', otp-version: '26' }
      - run: mix deps.get
      - run: mix test
      - run: mix hex.publish --yes
